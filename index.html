<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yadu's Library</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#1e1e1e;--panel:#252526;--line:#3c3c3c;--fg:#d4d4d4;--com:#6a9955;--kw:#569cd6;--str:#ce9178;--fn:#dcdcaa;--type:#4ec9b0;--num:#b5cea8;--pur:#c586c0;--err:#f44747}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.6 'Fira Code',Consolas,'Courier New',monospace;padding:1.5rem;max-width:1100px;margin:0 auto}
.bar{background:var(--panel);border:1px solid var(--line);border-bottom:0;padding:.4rem .8rem;color:#858585;font-size:12px;display:flex;gap:.5rem;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.box{border:1px solid var(--line);padding:1rem;margin-bottom:1.5rem}
.com{color:var(--com)}.kw{color:var(--kw)}.str{color:var(--str)}.fn{color:var(--fn)}.type{color:var(--type)}.num{color:var(--num)}.pur{color:var(--pur)}.err{color:var(--err)}
.row{display:flex;align-items:center;gap:.6rem}
input,select,textarea{background:var(--bg);color:var(--str);border:1px solid var(--line);font:inherit;padding:.4rem .6rem;width:100%;caret-color:var(--fg)}
input:focus,select:focus,textarea:focus{outline:1px solid var(--kw);border-color:var(--kw)}
::placeholder{color:#6a6a6a}
#q{border:0;border-bottom:1px solid var(--line);background:transparent}
button{background:var(--kw);color:#1e1e1e;border:0;font:inherit;font-weight:500;padding:.4rem 1rem;cursor:pointer;margin-top:.6rem}
button:hover{background:#6fb0ea}
.tbl{overflow-x:auto;margin-top:.8rem}
table{border-collapse:collapse;width:100%;white-space:nowrap}
th{color:var(--type);text-align:left;font-weight:500;padding:.3rem 1rem .3rem 0;border-bottom:1px solid var(--line)}
td{padding:.3rem 1rem .3rem 0;color:var(--str)}
td.n{color:var(--num)}
tbody tr:hover{background:var(--panel)}
.desc{border-left:2px solid var(--kw);padding:.3rem 1rem;margin-top:.8rem;background:var(--panel)}
label{display:block;color:var(--kw);margin:.7rem 0 .2rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 1.5rem}
.hidden{display:none}
.cur:after{content:'█';animation:b 1s steps(1) infinite;color:var(--fg)}
@keyframes b{50%{opacity:0}}
@media(max-width:700px){.grid{grid-template-columns:1fr}body{padding:.7rem}}
@media(prefers-reduced-motion:reduce){.cur:after{animation:none}}
.pdfrow{display:flex;gap:.8rem;align-items:center;padding:.25rem 0;border-bottom:1px solid var(--line)}
.pdfrow .nm{flex:1;color:var(--str);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdfrow button,.tb button{margin:0;padding:.2rem .7rem}
.tb{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin:.8rem 0}
.tb button.on{background:var(--type)}
.tb input{width:4.5rem}
#view{position:relative;height:78vh;overflow:auto;border:1px solid var(--line);background:var(--panel)}
#view .pg{margin:12px auto;border:1px solid var(--line);background:var(--bg)}
#view.flip{display:flex;perspective:1200px}
#flipcv{margin:auto;display:block;border:1px solid var(--line);transition:transform .18s ease-in}
@media(prefers-reduced-motion:reduce){#flipcv{transition:none}}
</style>
</head>
<body>
<div class="bar"><span class="dot" style="background:#f44747"></span><span class="dot" style="background:#dcdcaa"></span><span class="dot" style="background:#6a9955"></span>&nbsp;library.py</div>
<div class="box">
  <div class="com"># Yadu's Library - personal book catalogue</div>
  <div><span class="kw">import</span> <span class="type">library</span> <span class="kw">as</span> lib</div>
  <div id="stats" class="com">loading data...</div>
</div>

<div class="box">
  <div class="row"><span class="pur">&gt;&gt;&gt;</span><span class="fn">search</span>(<input id="q" placeholder='"title or author"' autofocus>)</div>
  <div id="results"></div>
</div>

<div class="box">
  <div class="com"># admin</div>
  <div class="grid">
    <div><label for="u">username</label><input id="u" autocomplete="off"></div>
    <div><label for="p">password</label><input id="p" type="password"></div>
  </div>
  <button id="login">login()</button>
  <span id="loginMsg"></span>

  <div id="admin" class="hidden">
    <div class="com" style="margin-top:1.2rem"># add a new title (copies a row to paste into the Google Sheet)</div>
    <div class="grid">
      <div><label>name</label><input id="an"><label>author</label><input id="aa"><label>language</label><input id="al"><label>date</label><input id="ad" type="date"></div>
      <div><label>copies</label><input id="ac" type="number" min="1" value="1"><label>barcode</label><input id="ab"><label>status</label><select id="av"><option>Available</option><option>Not Available</option></select><label>checked_out_by</label><input id="au"></div>
    </div>
    <label>description</label><textarea id="adesc" rows="3"></textarea>
    <button id="add">add_book()</button>
    <span id="addMsg"></span>
  </div>
</div>

<div class="box hidden" id="reader">
  <div class="row"><span class="com" style="flex:1"># pdf reader (admin only)</span><button id="logout" style="margin:0">logout()</button></div>
  <div class="grid">
    <div><label>upload pdf</label><input id="pdfFile" type="file" accept="application/pdf"></div>
    <div><label>&nbsp;</label><button id="pdfUp" style="margin:0">upload()</button></div>
  </div>
  <div id="pdfMsg" style="margin-top:.6rem"></div>
  <div id="pdfList" style="margin-top:.6rem"></div>
  <div id="viewer" class="hidden">
    <div class="tb">
      <span class="type" id="pdfTitle"></span>
    </div>
    <div class="tb">
      <button id="mScroll" class="on">scroll()</button><button id="mFlip">flip()</button>
      <button id="prev">prev()</button><input id="pgNo" type="number" min="1" value="1"><span class="num" id="pgTot"></span><button id="next">next()</button>
      <button id="zOut">zoom-</button><button id="zIn">zoom+</button><button id="pdfClose">close()</button>
    </div>
    <div id="view"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const SHEET_CSV = "https://docs.google.com/spreadsheets/d/10foSwd8HyCbltVFYT5HpuiiQMk9FFIkn-aVhH93_A78/gviz/tq?tqx=out:csv";
const COLS = ['Name of Book','Author','Language','N.o of Copies','Date','BAR CODE','Available/Not','Checked Out By'];
let books = [];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i+1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i+1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

async function load() {
  try {
    const res = await fetch(SHEET_CSV);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const rows = parseCSV(await res.text());
    const head = rows[0].map(h => h.trim());
    books = rows.slice(1)
      .map(r => Object.fromEntries(head.map((h, i) => [h, (r[i] || '').trim()])))
      .filter(b => b['Name of Book']);
    const uniq = k => new Set(books.map(b => b[k]).filter(Boolean)).size;
    const avail = books.filter(b => (b['Available/Not'] || '').toLowerCase().includes('available')).length;
    $('stats').innerHTML = `titles = <span class="num">${books.length}</span> &nbsp; available = <span class="num">${avail}</span> &nbsp; authors = <span class="num">${uniq('Author')}</span> &nbsp; languages = <span class="num">${uniq('Language')}</span>`;
    $('stats').className = '';
    search();
  } catch (e) {
    $('stats').innerHTML = '<span class="err">Error: could not load book data (' + esc(e.message) + ')</span>';
  }
}

function search() {
  const raw = $('q').value.trim(), q = raw.toLowerCase(), out = $('results');
  if (!q) { out.innerHTML = '<div class="com"># type a title or author above<span class="cur"></span></div>'; return; }
  const hits = books.filter(b => (b['Name of Book'] + ' ' + (b['Author'] || '')).toLowerCase().includes(q));
  if (!hits.length) { out.innerHTML = `<div class="err">NotFound: no titles matching "${esc(raw)}"</div>`; return; }
  const cols = COLS.filter(c => c in hits[0]);
  const titles = [...new Set(hits.map(b => b['Name of Book']))];
  out.innerHTML = `<div class="com"># ${hits.length} result${hits.length !== 1 ? 's' : ''} found</div>
    <div class="tbl"><table><thead><tr>${cols.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead>
    <tbody>${hits.map(b => `<tr>${cols.map(c => `<td class="${/Copies/.test(c) ? 'n' : ''}">${esc(b[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <label>describe</label><select id="pick">${titles.map(t => `<option>${esc(t)}</option>`).join('')}</select>
    <div id="descBox"></div>`;
  const show = () => {
    const t = $('pick').value, b = hits.find(x => x['Name of Book'] === t);
    $('descBox').innerHTML = `<div class="desc"><div class="type">${esc(t)}</div><div>${esc(b && b['Description'] || 'No description available for this title.')}</div></div>`;
  };
  $('pick').onchange = show; show();
}
$('q').addEventListener('input', search);

// ---------- Supabase config (fill these in) ----------
const SUPABASE_URL = "YOUR_SUPABASE_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const BUCKET = "pdfs";
const sb = (window.supabase && !SUPABASE_URL.startsWith('YOUR')) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

// ---------- Admin login ----------
// With Supabase configured, username = your admin email and the password is checked by Supabase Auth.
// Without it, the old demo check (admin / admin123) is used and the PDF reader stays hidden.
function setAdmin(on) {
  $('admin').classList.toggle('hidden', !on);
  $('reader').classList.toggle('hidden', !(on && sb));
  if (on && sb) listPdfs(); else closePdf();
}
$('login').onclick = async () => {
  let ok = false;
  if (sb) {
    const { error } = await sb.auth.signInWithPassword({ email: $('u').value.trim(), password: $('p').value });
    ok = !error;
  } else ok = $('u').value === 'admin' && $('p').value === 'admin123';
  $('loginMsg').innerHTML = ok ? ' <span class="com">&nbsp;# access granted</span>' : ' <span class="err">&nbsp;# invalid credentials</span>';
  setAdmin(ok);
};
$('logout').onclick = async () => { if (sb) await sb.auth.signOut(); $('loginMsg').innerHTML = ''; $('p').value = ''; setAdmin(false); };
if (sb) sb.auth.getSession().then(({ data }) => {
  if (data.session) { $('loginMsg').innerHTML = ' <span class="com">&nbsp;# session restored</span>'; setAdmin(true); }
});

// ---------- PDF library (private Supabase bucket) ----------
const pmsg = (t, c = 'com') => $('pdfMsg').innerHTML = `<span class="${c}"># ${esc(t)}</span>`;

async function listPdfs() {
  const { data, error } = await sb.storage.from(BUCKET).list('', { limit: 200, sortBy: { column: 'name', order: 'asc' } });
  if (error) { pmsg(error.message, 'err'); return; }
  const files = data.filter(f => f.name.toLowerCase().endsWith('.pdf'));
  $('pdfList').innerHTML = files.length
    ? files.map((f, i) => `<div class="pdfrow"><span class="nm">${esc(f.name)}</span><button data-o="${i}">open()</button><button data-d="${i}">delete()</button></div>`).join('')
    : '<div class="com"># no pdfs yet - upload one above</div>';
  $('pdfList').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.o !== undefined) openPdf(files[b.dataset.o].name);
    else if (b.dataset.d !== undefined) delPdf(files[b.dataset.d].name);
  };
}
$('pdfUp').onclick = async () => {
  const f = $('pdfFile').files[0];
  if (!f) { pmsg('choose a pdf first', 'err'); return; }
  const name = f.name.replace(/[^\w.\-]+/g, '_');
  pmsg('uploading ' + name + '...');
  const { error } = await sb.storage.from(BUCKET).upload(name, f, { contentType: 'application/pdf' });
  if (error) pmsg(error.message, 'err'); else { pmsg('uploaded ' + name); $('pdfFile').value = ''; listPdfs(); }
};
async function delPdf(name) {
  if (!confirm('Delete ' + name + '?')) return;
  const { error } = await sb.storage.from(BUCKET).remove([name]);
  if (error) pmsg(error.message, 'err'); else { pmsg('deleted ' + name); closePdf(); listPdfs(); }
}

// ---------- PDF reader ----------
let pdf = null, cur = 1, mode = 'scroll', zoom = 1, busy = false, obs = null, buildTok = 0;

async function openPdf(name) {
  pmsg('loading ' + name + '...');
  const { data, error } = await sb.storage.from(BUCKET).download(name);
  if (error) { pmsg(error.message, 'err'); return; }
  try { pdf = await pdfjsLib.getDocument({ data: await data.arrayBuffer() }).promise; }
  catch (e) { pmsg('cannot read pdf: ' + e.message, 'err'); return; }
  cur = 1; zoom = 1;
  $('pdfTitle').textContent = name;
  $('pgNo').max = pdf.numPages; $('pgNo').value = 1; $('pgTot').textContent = '/ ' + pdf.numPages;
  $('viewer').classList.remove('hidden');
  pmsg('opened ' + name);
  render();
}
function closePdf() {
  pdf = null; buildTok++;
  if (obs) obs.disconnect();
  $('viewer').classList.add('hidden'); $('view').innerHTML = '';
}
async function paint(page, canvas, scale) {
  const dpr = window.devicePixelRatio || 1, vp = page.getViewport({ scale: scale * dpr });
  canvas.width = vp.width; canvas.height = vp.height;
  canvas.style.width = vp.width / dpr + 'px'; canvas.style.height = vp.height / dpr + 'px';
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
}
function render() {
  if (!pdf) return;
  $('mScroll').classList.toggle('on', mode === 'scroll');
  $('mFlip').classList.toggle('on', mode === 'flip');
  mode === 'scroll' ? buildScroll() : buildFlip(cur);
}

// scroll mode: all pages stacked, rendered lazily as they come into view
async function buildScroll() {
  const v = $('view'), tok = ++buildTok;
  if (obs) obs.disconnect();
  v.className = 'scroll'; v.innerHTML = '';
  const b = (await pdf.getPage(1)).getViewport({ scale: 1 });
  if (tok !== buildTok) return;
  const scale = Math.max(.3, (v.clientWidth - 30) / b.width) * zoom;
  obs = new IntersectionObserver(es => es.forEach(async e => {
    if (!e.isIntersecting || e.target.dataset.done) return;
    e.target.dataset.done = 1;
    const c = document.createElement('canvas');
    await paint(await pdf.getPage(+e.target.dataset.n), c, scale);
    e.target.style.width = c.style.width; e.target.style.height = c.style.height;
    e.target.appendChild(c);
  }), { root: v, rootMargin: '800px 0px' });
  for (let n = 1; n <= pdf.numPages; n++) {
    const d = document.createElement('div');
    d.className = 'pg'; d.dataset.n = n;
    d.style.width = b.width * scale + 'px'; d.style.height = b.height * scale + 'px';
    v.appendChild(d); obs.observe(d);
  }
  const t = v.children[cur - 1]; if (t) v.scrollTop = t.offsetTop - 12;
  v.onscroll = () => {
    const y = v.scrollTop + v.clientHeight / 3; let n = 1;
    for (const c of v.children) { if (c.offsetTop <= y) n = +c.dataset.n; else break; }
    if (n !== cur) { cur = n; $('pgNo').value = n; }
  };
}

// flip mode: one page at a time with a page-turn animation
async function buildFlip(n, dir = 0) {
  if (busy) return; busy = true; buildTok++;
  try {
    const v = $('view'); if (obs) obs.disconnect(); v.onscroll = null;
    let c = $('flipcv');
    if (!c || v.className !== 'flip') { v.className = 'flip'; v.innerHTML = '<canvas id="flipcv"></canvas>'; c = $('flipcv'); dir = 0; }
    if (dir) { c.style.transform = `rotateY(${dir > 0 ? -90 : 90}deg)`; await new Promise(r => setTimeout(r, 180)); }
    const pg = await pdf.getPage(n), b = pg.getViewport({ scale: 1 });
    const scale = Math.min((v.clientWidth - 30) / b.width, (v.clientHeight - 30) / b.height) * zoom;
    await paint(pg, c, scale);
    cur = n; $('pgNo').value = n;
    if (dir) {
      c.style.transition = 'none'; c.style.transform = `rotateY(${dir > 0 ? 90 : -90}deg)`;
      void c.offsetWidth; c.style.transition = ''; c.style.transform = 'rotateY(0deg)';
    }
  } finally { busy = false; }
}

function go(n) {
  if (!pdf) return;
  n = Math.max(1, Math.min(pdf.numPages, +n || 1));
  if (mode === 'flip') { if (n !== cur) buildFlip(n, n > cur ? 1 : -1); else $('pgNo').value = cur; }
  else { const t = $('view').children[n - 1]; if (t) $('view').scrollTop = t.offsetTop - 12; cur = n; $('pgNo').value = n; }
}
$('mScroll').onclick = () => { mode = 'scroll'; render(); };
$('mFlip').onclick = () => { mode = 'flip'; render(); };
$('prev').onclick = () => go(cur - 1);
$('next').onclick = () => go(cur + 1);
$('pgNo').onchange = e => go(e.target.value);
$('zIn').onclick = () => { zoom = Math.min(3, zoom + .25); render(); };
$('zOut').onclick = () => { zoom = Math.max(.5, zoom - .25); render(); };
$('pdfClose').onclick = closePdf;
document.addEventListener('keydown', e => {
  if (!pdf || mode !== 'flip' || ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  if (e.key === 'ArrowRight') go(cur + 1); else if (e.key === 'ArrowLeft') go(cur - 1);
});
let tx = 0;
$('view').addEventListener('touchstart', e => { tx = e.touches[0].clientX; }, { passive: true });
$('view').addEventListener('touchend', e => {
  if (mode !== 'flip') return;
  const dx = e.changedTouches[0].clientX - tx;
  if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1));
});

$('add').onclick = () => {
  const name = $('an').value.trim(), m = $('addMsg');
  if (!name) { m.innerHTML = ' <span class="err">&nbsp;# enter a book name first</span>'; return; }
  const row = [name,$('aa').value,$('al').value,$('ac').value,$('ad').value,$('ab').value,$('av').value,$('au').value,$('adesc').value].join('\t');
  navigator.clipboard.writeText(row).then(
    () => m.innerHTML = ` <span class="com">&nbsp;# row copied - paste it into the next empty row of the sheet</span>`,
    () => m.innerHTML = ' <span class="err">&nbsp;# copy failed - allow clipboard access</span>');
};

load(); search();
</script>
</body>
</html>
